[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "1.4.2"
description = "Task Tracker HTTP service"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "mypy>=2"]

[project.scripts]
task-tracker = "task_tracker.__main__:main"

[tool.setuptools.packages.find]
include = ["task_tracker*"]

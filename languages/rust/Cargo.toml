[workspace]
resolver = "3"
members = [
    "modules/*",
    "modules/*/exercises/*",
    "projects/*/starter",
]

[workspace.package]
edition = "2024"
publish = false
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["trace", "cors", "timeout", "fs", "compression-gzip", "request-id", "limit", "catch-panic", "set-header"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rand = "0.10"
regex = "1"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
hex = "0.4"
flate2 = "1"
tempfile = "3"
minijinja = "3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
argon2 = "0.6"
jsonwebtoken = "11"
clap = { version = "4", features = ["derive", "env"] }
secrecy = "0.10"
wiremock = "0.6"
criterion = "0.8"

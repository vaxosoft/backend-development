[project]
name = "backend-learning-python"
version = "0.1.0"
description = "Learning backend development in Python (course repository, not a published package)"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# starter code intentionally has unused parameters and TODO bodies
"**/exercises/**" = ["ARG"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
anyio_mode = "auto"

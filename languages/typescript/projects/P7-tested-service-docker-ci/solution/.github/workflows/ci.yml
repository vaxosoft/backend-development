name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Restore
        run: npm ci
      - name: Build (type check)
        run: npx tsc --noEmit
      - name: Format check
        run: npx biome format .
      - name: Lint
        run: npx biome lint .
      - name: Test
        run: node --test "tests/**/*.test.ts"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: languages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: languages/python/requirements.txt
      - run: pip install -r requirements.txt
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy modules/14-packaging-and-running/examples
      - name: Test
        run: pytest tests

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: >
          docker build
          -f languages/python/modules/14-packaging-and-running/examples/deploy/Dockerfile
          --build-arg APP_VERSION=${{ github.ref_name }}
          --build-arg GIT_COMMIT=${{ github.sha }}
          -t task-tracker:${{ github.sha }}
          languages/python/modules/14-packaging-and-running/examples

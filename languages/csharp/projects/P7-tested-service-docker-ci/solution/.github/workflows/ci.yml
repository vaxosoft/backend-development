name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/P7.TestedService.Tests.csproj

      - name: Build (lint: analyzer warnings are errors)
        run: dotnet build tests/P7.TestedService.Tests.csproj --no-restore -c Release -warnaserror

      - name: Format check
        run: |
          dotnet format whitespace P7.TestedService.csproj --verify-no-changes
          dotnet format whitespace tests/P7.TestedService.Tests.csproj --verify-no-changes

      - name: Test
        run: dotnet test tests/P7.TestedService.Tests.csproj --no-build -c Release
